<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>

    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .player-container {
            width: 90%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <h3 style="margin-bottom: 15px;">تاقیکردنەوەی پلەیەر</h3>

    <div class="player-container">
        <iframe 
            src="https://simply.tubepress.io/embed/busty-milf-dee-williams-takes-bbc-anal-from-sean-michaels" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // لێنکە ڕاستەوخۆکەی Adsterra (Direct Link) لەم نێوانە دابنێ
        const adsterraDirectLink = "https://www.highrevenuegate.com/your-direct-link-here";

        let hasOpenedAd = false;

        // کاتێک بەکارهێنەر لە هەر شوێنێکی لاپەڕەکە کلیک دەکات
        window.addEventListener('click', function() {
            if (!hasOpenedAd) {
                // ڕیکلامەکە لە تەبێکی تەواو نوێدا دەکاتەوە
                window.open(adsterraDirectLink, '_blank');
                // بەمەش سایتی خۆت بە کراوەیی لە شوێنی خۆی دەمێنێتەوە و ناوەستێت
                hasOpenedAd = true; 
            }
        });
    </script>

</body>
</html>
