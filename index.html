<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>Test Video Player</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>تاقیکردنەوەی لێدانی ڤیدیۆ (Embed Test)</h1>

    <div class="player-container">
        <iframe src="https://www.xnxx.com/embedframe/kmcefmbaebb" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen="allowfullscreen">
        </iframe>
    </div>

</body>
</html>
