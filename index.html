<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Play Shorts Scroll Test</title>

    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        h2 {
            margin-bottom: 20px;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            align-items: center;
        }

        .player-container {
            position: relative;
            width: 90%;
            max-width: 360px;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* داپۆشینی دوگمەی Watch on YouTube */
        .bottom-blocker {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 170px;
            height: 55px;
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>

    <h2>تاقیکردنەوەی ۳ Shorts بە ئۆتۆ پلەی لە کاتی سکڕۆڵ</h2>

    <div class="feed-container">
        <!-- ڤیدیۆی یەکەم -->
        <div class="player-container">
            <div class="bottom-blocker"></div>
            <iframe 
                id="player1"
                src="https://www.youtube.com/embed/6rXYgfa4KlA?enablejsapi=1&mute=1&modestbranding=1&rel=0" 
                title="Shorts Video 1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- ڤیدیۆی دووەم -->
        <div class="player-container">
            <div class="bottom-blocker"></div>
            <iframe 
                id="player2"
                src="https://www.youtube.com/embed/6rXYgfa4KlA?enablejsapi=1&mute=1&modestbranding=1&rel=0" 
                title="Shorts Video 2"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- ڤیدیۆی سێیەم -->
        <div class="player-container">
            <div class="bottom-blocker"></div>
            <iframe 
                id="player3"
                src="https://www.youtube.com/embed/6rXYgfa4KlA?enablejsapi=1&mute=1&modestbranding=1&rel=0" 
                title="Shorts Video 3"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // دۆزینەوەی تەواوی فریمەکانی پلەیەر
        const containers = document.querySelectorAll('.player-container');

        // کۆنتڕۆڵکردنی کاتی سکڕۆڵ
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.6 // کاتێک ٦٠٪ی ڤیدیۆکە لە ناو شاشەکە دەرکەوت دەکەوێتە کار
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const iframe = entry.target.querySelector('iframe');
                
                if (entry.isIntersecting) {
                    // کاتێک هاتە ناو شاشە: Play دەکات
                    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                } else {
                    // کاتێک لە شاشە دەرچوو: Pause دەکات
                    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                }
            });
        }, observerOptions);

        containers.forEach(container => {
            observer.observe(container);
        });
    </script>

</body>
</html>
