<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>

    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .player-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* تەبەقەی ڕوون بۆ بەدەست هێنانی یەکەم کلیک */
        .ad-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>

    <h3 style="margin-bottom: 15px;">تاقیکردنەوەی پلەیەر</h3>

    <div class="player-container">
        <!-- تەبەقەی ڕوون -->
        <div id="adOverlay" class="ad-overlay"></div>
        
        <iframe 
            src="https://simply.tubepress.io/embed/busty-milf-dee-williams-takes-bbc-anal-from-sean-michaels" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Scriptی Popunderی Adsterra -->
    <script src="https://pl30693295.effectivecpmnetwork.com/69/19/20/691920fa8eef99e6a4e9de8ba3e03171.js"></script>

    <script>
        const overlay = document.getElementById('adOverlay');

        // لە یەکەم کلیکی بەکارهێنەر لەسەر پلەیەرەکە، تەبەقەکە لادەبرێت
        overlay.addEventListener('click', function() {
            overlay.style.display = 'none';
        });
    </script>

</body>
</html>
