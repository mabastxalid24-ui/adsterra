<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .player-container {
            width: 90%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h3 style="margin-bottom: 15px;">تاقیکردنەوەی پلەیەر</h3>

    <div class="player-container">
        <video controls playsinline webkit-playsinline preload="auto">
            <!-- لێنکە MP4ەکەی خۆت لێرە دابنێ -->
            <source src="لێنکی_ڤیدیۆکەی_خۆت.mp4" type="video/mp4">
            پێگەڕەکەت پشتگیری ئەم پلەیەرە ناکات.
        </video>
    </div>

</body>
</html>
