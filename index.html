<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>

    <style>
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .player-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* بەربەست لەسەر دوگمەی Watch on YouTube لە بەشی ڕاستی خوارەوە */
        .bottom-blocker {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 170px; /* پان بوونی شوێنی دوگمەکەی یوتوب */
            height: 55px;  /* بەرزایی دوگمەکە */
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>

    <h3 style="margin-bottom: 15px;">تاقیکردنەوەی پلەیەر</h3>

    <div class="player-container">
        <!-- ئەم بەشە کلیکی دوگمەی Watch on YouTube پەک دەخات -->
        <div class="bottom-blocker"></div>

        <iframe 
            src="https://www.youtube.com/embed/BfFVorulC4c?modestbranding=1&rel=0" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
