<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>Test Video Player (HLS Stream)</title>
    <!-- لۆدکردنی کتێبخانەی HLS.js بۆ پشتگیری لێنکی m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>تاقیکردنەوەی پلەیەری بێ ڕیکلام (HLS)</h1>

    <div class="player-container">
        <video id="video" controls playsinline></video>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        } else {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
